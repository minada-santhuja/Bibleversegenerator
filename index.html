<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>බයිබල් පද කාඩ් එක</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yaldevi:wght@400;700&family=Poppins:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f5f8;--panel:#fff;--text:#1c1f26;--muted:#6b7280;--line:#dfe3ea;--accent:#6d5efc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141a;--panel:#1b1e27;--text:#eef0f5;--muted:#9aa3b2;--line:#2c303c;--accent:#8b7fff}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Yaldevi','Poppins',system-ui,sans-serif;background-color:var(--bg)}
.wrap{max-width:1100px;margin:0 auto;padding:20px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
h1{font-size:20px;margin:0 0 14px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
textarea,input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--text);font:inherit;font-size:15px}
textarea{min-height:84px;resize:vertical}
.colors{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.colors div{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px}
input[type=color]{width:38px;height:30px;border:none;background:none;padding:0;cursor:pointer}
button{margin-top:18px;width:100%;padding:13px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
canvas{width:100%;height:auto;aspect-ratio:1/1;border-radius:14px;display:block}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h1>බයිබල් පද කාඩ් එක සාදන්න</h1>
    <label>බයිබල් පදය (සිංහල)</label>
    <textarea id="si">සමිඳාණන් වහන්සේ මාගේ එඬේරාය; මට අඩුවක් නොවන්නේය.</textarea>
    <label>උපුටා ගත් පාඨය (සිංහල)</label>
    <input type="text" id="ref" value="ගීතාවලිය 23:1">
    <label>English verse</label>
    <textarea id="en">The Lord is my shepherd; I shall not want.</textarea>
    <label>English reference (optional)</label>
    <input type="text" id="enref" value="Psalm 23:1">
    <label>වර්ණ තෝරන්න</label>
    <div class="colors">
      <div><input type="color" id="cBg" value="#3b5bdb"> Background</div>
      <div><input type="color" id="cText" value="#ffffff"> පදයේ අකුරු</div>
      <div><input type="color" id="cRef" value="#ffd966"> පාඨයේ අකුරු</div>
      <div><input type="color" id="cIcon" value="#ffffff"> අයිකන</div>
    </div>
    <button id="dl">⬇ JPEG එක බාගන්න (2160×2160)</button>
    <div class="hint">සිංහල පදයේ කොමා ස්වයංක්‍රීයව ඉවත් වේ. අකුරු ප්‍රමාණය කොටුවට ගැලපෙන සේ ස්වයංක්‍රීයව සකස් වේ.</div>
  </div>
  <div class="panel">
    <canvas id="cv" width="1080" height="1080"></canvas>
    <div class="hint">Preview – බාගත කරන රූපය මීටත් වඩා high quality ය.</div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const ICONS={
 heart:"M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z",
 comment:"M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z",
 share:"M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"
};
function hex2hsl(h){let r=parseInt(h.slice(1,3),16)/255,g=parseInt(h.slice(3,5),16)/255,b=parseInt(h.slice(5,7),16)/255;
 const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let H=0,S=0,L=(mx+mn)/2;
 if(mx!==mn){const d=mx-mn;S=L>.5?d/(2-mx-mn):d/(mx+mn);
  H=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;H*=60}
 return[H,S*100,L*100]}
const hsl=(h,s,l,a=1)=>`hsla(${((h%360)+360)%360},${Math.min(100,s)}%,${Math.max(0,Math.min(100,l))}%,${a})`;

function drawBg(c,S,base){
 const[h,s,l]=hex2hsl(base);
 const g=c.createLinearGradient(0,0,S,S);
 g.addColorStop(0,hsl(h,s,Math.min(l+18,85)));g.addColorStop(1,hsl(h+25,s,Math.max(l-22,8)));
 c.fillStyle=g;c.fillRect(0,0,S,S);
 const blob=(x,y,r,col)=>{const rg=c.createRadialGradient(x,y,0,x,y,r);rg.addColorStop(0,col);rg.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=rg;c.fillRect(0,0,S,S)};
 blob(S*.15,S*.2,S*.45,hsl(h+40,Math.max(s,70),65,.75));
 blob(S*.85,S*.75,S*.5,hsl(h-50,Math.max(s,70),60,.7));
 blob(S*.7,S*.1,S*.3,hsl(h+10,s,85,.45));
}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function wrap(c,text,font,maxW){
 c.font=font;const words=text.split(/\s+/).filter(Boolean),lines=[];let cur='';
 for(const w of words){const t=cur?cur+' '+w:w;if(c.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t}
 if(cur)lines.push(cur);return lines}

async function render(cv,S){
 const si=$('si').value.replace(/[,，、،]/g,'').trim(), ref=$('ref').value.trim();
 const en=$('en').value.trim(), enref=$('enref').value.trim();
 await Promise.all([
  document.fonts.load('400 40px Yaldevi',si+ref),document.fonts.load('700 40px Yaldevi',ref+si),
  document.fonts.load('italic 400 30px Poppins',en),document.fonts.load('600 30px Poppins','Supuwatha'),document.fonts.load('400 30px Poppins','free')
 ]).catch(()=>{});
 cv.width=cv.height=S;const c=cv.getContext('2d'),k=S/1080;c.setTransform(k,0,0,k,0,0);
 const base=$('cBg').value;
 drawBg(c,1080,base);
 // card geometry
 const cx=70,cy=55,cw=940,ch=805,R=44;
 // frosted blur of background
 const tmp=document.createElement('canvas');tmp.width=tmp.height=S;
 const t=tmp.getContext('2d');t.setTransform(k,0,0,k,0,0);drawBg(t,1080,base);
 c.save();rr(c,cx,cy,cw,ch,R);
 c.shadowColor='rgba(0,0,0,.28)';c.shadowBlur=50;c.shadowOffsetY=20;c.fillStyle='rgba(255,255,255,.1)';c.fill();c.restore();
 c.save();rr(c,cx,cy,cw,ch,R);c.clip();
 if('filter' in c){c.filter='blur(28px)';c.setTransform(1,0,0,1,0,0);c.drawImage(tmp,-60,-60,S+120,S+120);c.filter='none';c.setTransform(k,0,0,k,0,0)}
 const gl=c.createLinearGradient(cx,cy,cx+cw,cy+ch);
 gl.addColorStop(0,'rgba(255,255,255,.30)');gl.addColorStop(1,'rgba(255,255,255,.08)');
 c.fillStyle=gl;c.fillRect(cx,cy,cw,ch);c.restore();
 c.save();rr(c,cx,cy,cw,ch,R);c.lineWidth=2.5;
 const bd=c.createLinearGradient(cx,cy,cx+cw,cy+ch);bd.addColorStop(0,'rgba(255,255,255,.75)');bd.addColorStop(.5,'rgba(255,255,255,.12)');bd.addColorStop(1,'rgba(255,255,255,.4)');
 c.strokeStyle=bd;c.stroke();c.restore();

 // big quote marks
 c.save();c.fillStyle=$('cRef').value;c.globalAlpha=.55;c.font="bold 230px Georgia,serif";c.textBaseline='alphabetic';
 c.textAlign='left';c.fillText('\u201C',cx+34,cy+200);
 c.textAlign='right';c.fillText('\u201D',cx+cw-34,cy+ch-10);c.restore();

 // text fit
 const tx1=cx+120,tx2=cx+cw-135,tw=tx2-tx1,tcx=(tx1+tx2)/2,availH=ch-150;
 const build=a=>{
  const b=[];let h=0;
  const L1=wrap(c,si,`400 ${a}px Yaldevi`,tw);b.push({l:L1,f:`400 ${a}px Yaldevi`,lh:a*1.75,col:$('cText').value,gap:0});
  const rs=a*.6;if(ref){const L=wrap(c,ref,`700 ${rs}px Yaldevi`,tw);b.push({l:L,f:`700 ${rs}px Yaldevi`,lh:rs*1.7,col:$('cRef').value,gap:a*.35})}
  const es=a*.5;if(en){const L=wrap(c,en,`italic 400 ${es}px Poppins`,tw);b.push({l:L,f:`italic 400 ${es}px Poppins`,lh:es*1.5,col:$('cText').value,gap:a*.75,alpha:.92,line:true})}
  const ers=a*.4;if(enref){b.push({l:[enref],f:`600 ${ers}px Poppins`,lh:ers*1.6,col:$('cRef').value,gap:a*.2})}
  b.forEach(x=>{h+=x.gap+x.l.length*x.lh});return{b,h}};
 let a=74,r=build(a);while(r.h>availH&&a>16){a-=1;r=build(a)}
 let y=cy+(ch-r.h)/2;
 c.textAlign='center';c.textBaseline='middle';
 for(const x of r.b){
  y+=x.gap;
  if(x.line){c.save();c.strokeStyle='rgba(255,255,255,.4)';c.lineWidth=2;c.beginPath();c.moveTo(tcx-60,y-x.gap/2);c.lineTo(tcx+60,y-x.gap/2);c.stroke();c.restore()}
  c.font=x.f;c.fillStyle=x.col;c.globalAlpha=x.alpha||1;
  c.shadowColor='rgba(0,0,0,.25)';c.shadowBlur=8;c.shadowOffsetY=2;
  for(const ln of x.l){c.fillText(ln,tcx,y+x.lh/2);y+=x.lh}
  c.globalAlpha=1;c.shadowBlur=0;c.shadowOffsetY=0}

 // icons
 const ix=cx+cw-62,iy=cy+ch/2;
 [['heart',-105],['comment',0],['share',105]].forEach(([n,dy])=>{
  c.save();c.beginPath();c.arc(ix,iy+dy,35,0,Math.PI*2);
  c.fillStyle='rgba(255,255,255,.18)';c.fill();c.lineWidth=2;c.strokeStyle='rgba(255,255,255,.5)';c.stroke();
  c.translate(ix-21,iy+dy-21);c.scale(1.75,1.75);c.fillStyle=$('cIcon').value;c.fill(new Path2D(ICONS[n]));c.restore()});

 // footer
 c.save();c.textAlign='center';c.textBaseline='middle';c.fillStyle='#fff';c.shadowColor='rgba(0,0,0,.35)';c.shadowBlur=10;
 c.font='600 40px Poppins';c.fillText('Supuwatha Thulin',540,925);
 c.font='400 26px Poppins';c.globalAlpha=.92;
 c.fillText('SupuwathaThulinRadio.free.nf',540,978);c.fillText('SupuwathaThulin.free.je',540,1020);c.restore();
}

const cv=$('cv');let tm;
const refresh=()=>{clearTimeout(tm);tm=setTimeout(()=>render(cv,1080),120)};
['si','ref','en','enref','cBg','cText','cRef','cIcon'].forEach(i=>$(i).addEventListener('input',refresh));
document.fonts.ready.then(refresh);refresh();
$('dl').addEventListener('click',async()=>{
 const b=$('dl'),old=b.textContent;b.textContent='සකසමින්…';
 const big=document.createElement('canvas');await render(big,2160);
 big.toBlob(bl=>{const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='bible-verse-card.jpg';document.body.appendChild(a);a.click();a.remove();b.textContent=old},'image/jpeg',0.95);
});
</script>
</body>
</html>
